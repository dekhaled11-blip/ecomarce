<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات | منصتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- القائمة الجانبية -->
    <aside class="w-64 bg-white shadow-xl flex flex-col hidden md:flex z-20">
        <div class="h-20 flex items-center justify-center border-b border-gray-100">
            <a href="index.html" class="text-2xl font-bold text-blue-700"><i class="fa-solid fa-store ml-2"></i>منصتي</a>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="vendor-dashboard.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
                <i class="fa-solid fa-chart-pie w-6"></i><span class="font-medium">نظرة عامة</span>
            </a>
            <a href="vendor-products.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
                <i class="fa-solid fa-box-open w-6"></i><span class="font-medium">المنتجات</span>
            </a>
            <a href="vendor-orders.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
                <i class="fa-solid fa-cart-shopping w-6"></i><span class="font-medium">الطلبات</span>
            </a>
            <a href="vendor-notifications.html" class="flex items-center px-4 py-3 bg-blue-600 text-white rounded-lg shadow-md transition-colors">
                <i class="fa-solid fa-bell w-6"></i><span class="font-medium">الإشعارات</span>
                <span id="sidebarUnreadBadge" class="hidden mr-auto bg-white text-blue-700 py-1 px-2 rounded-full text-xs font-bold"></span>
            </a>
            <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
                <i class="fa-solid fa-wallet w-6"></i><span class="font-medium">الأرباح</span>
            </a>
            <a href="vendor-settings.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
                <i class="fa-solid fa-gear w-6"></i><span class="font-medium">إعدادات المتجر</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center">
                <img id="vendorAvatar" src="https://ui-avatars.com/api/?name=تاجر&background=1d4ed8&color=fff" alt="Avatar" class="w-10 h-10 rounded-full">
                <div class="mr-3">
                    <p id="vendorName" class="text-sm font-bold text-gray-800">...</p>
                    <a href="#" id="logoutBtn" class="text-xs text-red-500 hover:text-red-700 transition-colors">تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h2 class="text-xl font-bold text-gray-800">الإشعارات</h2>
            <button id="markAllReadBtn" class="text-sm text-blue-600 hover:underline font-medium disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                <i class="fa-solid fa-check-double ml-1"></i> تعليم الكل كمقروء
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-8">
            <div class="max-w-3xl mx-auto">

                <!-- حالة التحميل -->
                <div id="loadingState" class="text-center py-16 text-gray-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                    <p>جارٍ تحميل الإشعارات...</p>
                </div>

                <!-- حالة الخطأ -->
                <div id="errorState" class="hidden text-center py-16">
                    <i class="fa-solid fa-triangle-exclamation text-3xl text-red-400 mb-3"></i>
                    <p class="text-red-600" id="errorText"></p>
                    <button onclick="loadNotifications()" class="mt-4 text-sm text-blue-600 hover:underline">إعادة المحاولة</button>
                </div>

                <!-- حالة عدم وجود إشعارات -->
                <div id="emptyState" class="hidden text-center py-16 text-gray-400">
                    <i class="fa-regular fa-bell-slash text-4xl mb-3"></i>
                    <p>لا توجد إشعارات حتى الآن</p>
                </div>

                <!-- قائمة الإشعارات -->
                <div id="notificationsList" class="space-y-3"></div>

                <!-- ترقيم الصفحات -->
                <div id="pagination" class="hidden flex items-center justify-center gap-2 mt-6"></div>

            </div>
        </div>
    </main>

    <script src="assets/api-config.js"></script>
    <script>
        // حماية الصفحة: لا وصول بدون تسجيل دخول تاجر
        if (!localStorage.getItem("vendor_token")) {
            window.location.href = "vendor-login.html";
        }

        const vendorInfo = JSON.parse(localStorage.getItem("vendor_info") || "{}");
        document.getElementById("vendorName").textContent = vendorInfo.store_name || "تاجر";
        document.getElementById("vendorAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(vendorInfo.store_name || "تاجر")}&background=1d4ed8&color=fff`;

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("vendor_token");
            localStorage.removeItem("vendor_info");
            window.location.href = "vendor-login.html";
        });

        const TYPE_ICONS = {
            new_order: { icon: "fa-cart-shopping", color: "text-blue-600 bg-blue-100" },
            payment_approved: { icon: "fa-check", color: "text-green-600 bg-green-100" },
            payment_rejected: { icon: "fa-xmark", color: "text-red-600 bg-red-100" },
            account_suspended: { icon: "fa-ban", color: "text-red-600 bg-red-100" },
            trial_ending_soon: { icon: "fa-hourglass-half", color: "text-yellow-600 bg-yellow-100" },
            subscription_ending_soon: { icon: "fa-hourglass-half", color: "text-yellow-600 bg-yellow-100" },
            trial_expired: { icon: "fa-lock", color: "text-red-600 bg-red-100" },
            payment_reminder: { icon: "fa-bell", color: "text-blue-600 bg-blue-100" },
            trial_extended: { icon: "fa-calendar-plus", color: "text-green-600 bg-green-100" }
        };

        // تحويل تاريخ ثابت لعبارة نسبية مفهومة ("منذ 5 دقائق") — لمسة تحسّن تجربة القراءة السريعة
        function timeAgo(isoDate) {
            const diffSec = Math.floor((Date.now() - new Date(isoDate + "Z")) / 1000);
            if (diffSec < 60) return "الآن";
            const diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return `منذ ${diffMin} دقيقة`;
            const diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return `منذ ${diffHour} ساعة`;
            const diffDay = Math.floor(diffHour / 24);
            return `منذ ${diffDay} يوم`;
        }

        let currentPage = 1;

        async function loadNotifications(page = 1) {
            currentPage = page;
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("errorState").classList.add("hidden");
            document.getElementById("emptyState").classList.add("hidden");
            document.getElementById("notificationsList").innerHTML = "";
            document.getElementById("pagination").classList.add("hidden");

            try {
                const data = await apiRequest(`/api/vendor/notifications?page=${page}&limit=10`);
                document.getElementById("loadingState").classList.add("hidden");

                updateUnreadBadge(data.unread_count);
                document.getElementById("markAllReadBtn").disabled = data.unread_count === 0;

                if (data.notifications.length === 0) {
                    document.getElementById("emptyState").classList.remove("hidden");
                    return;
                }

                renderNotifications(data.notifications);
                renderPagination(data.pagination);

            } catch (err) {
                document.getElementById("loadingState").classList.add("hidden");
                document.getElementById("errorText").textContent = err.message;
                document.getElementById("errorState").classList.remove("hidden");
            }
        }

        function updateUnreadBadge(count) {
            const badge = document.getElementById("sidebarUnreadBadge");
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        function renderNotifications(notifications) {
            const list = document.getElementById("notificationsList");
            list.innerHTML = notifications.map(n => {
                const typeInfo = TYPE_ICONS[n.type] || { icon: "fa-bell", color: "text-gray-600 bg-gray-100" };
                const unreadClasses = n.is_read ? "bg-white" : "bg-blue-50 border-blue-100";
                return `
                    <div class="border ${unreadClasses} rounded-xl p-4 flex items-start gap-4 transition-colors ${n.is_read ? '' : 'cursor-pointer hover:bg-blue-100/50'}"
                         ${n.is_read ? '' : `onclick="markAsRead(${n.id})"`}>
                        <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${typeInfo.color}">
                            <i class="fa-solid ${typeInfo.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm text-gray-800 ${n.is_read ? '' : 'font-bold'}">${escapeHtml(n.message)}</p>
                            <p class="text-xs text-gray-400 mt-1">${timeAgo(n.created_at)}</p>
                        </div>
                        ${n.is_read ? '' : '<span class="w-2.5 h-2.5 bg-blue-600 rounded-full mt-1.5 flex-shrink-0"></span>'}
                    </div>
                `;
            }).join("");
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function renderPagination(pagination) {
            if (pagination.total_pages <= 1) return;
            const container = document.getElementById("pagination");
            container.classList.remove("hidden");
            let html = "";
            for (let i = 1; i <= pagination.total_pages; i++) {
                html += `<button onclick="loadNotifications(${i})" class="w-9 h-9 rounded-lg ${i === pagination.page ? 'bg-blue-600 text-white font-bold' : 'border border-gray-200 text-gray-600 hover:bg-gray-100'} transition-colors">${i}</button>`;
            }
            container.innerHTML = html;
        }

        async function markAsRead(id) {
            try {
                await apiRequest(`/api/vendor/notifications/${id}/read`, { method: "PUT" });
                loadNotifications(currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById("markAllReadBtn").addEventListener("click", async () => {
            try {
                await apiRequest("/api/vendor/notifications/read-all", { method: "PUT" });
                loadNotifications(currentPage);
            } catch (err) {
                alert(err.message);
            }
        });

        loadNotifications();
    </script>

</body>
</html>
