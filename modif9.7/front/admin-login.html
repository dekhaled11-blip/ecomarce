<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>دخول المشرف</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-blue-700 text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-900">دخول لوحة المشرف</h2>
            <p class="text-sm text-gray-500 mt-1">هذه الصفحة مخصصة لإدارة المنصة فقط</p>
        </div>

        <div id="errorBanner" class="hidden mb-5 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-start gap-2">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span id="errorMessage"></span>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                <input id="email" type="email" required placeholder="admin@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-left" dir="ltr">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                <input id="password" type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-700 text-white font-bold rounded-lg py-3 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all flex justify-center items-center mt-2 disabled:opacity-60 disabled:cursor-not-allowed">
                <span id="submitText">تسجيل الدخول</span>
                <i id="submitSpinner" class="fa-solid fa-circle-notch fa-spin mr-2 hidden"></i>
            </button>
        </form>
    </div>

    <script src="assets/api-config.js"></script>
    <script>
        const form = document.getElementById("loginForm");
        const errorBanner = document.getElementById("errorBanner");
        const errorMessage = document.getElementById("errorMessage");
        const submitBtn = document.getElementById("submitBtn");
        const submitText = document.getElementById("submitText");
        const submitSpinner = document.getElementById("submitSpinner");

        function showError(message) {
            errorMessage.textContent = message;
            errorBanner.classList.remove("hidden");
        }
        function hideError() {
            errorBanner.classList.add("hidden");
        }
        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitText.textContent = isLoading ? "جارٍ الدخول..." : "تسجيل الدخول";
            submitSpinner.classList.toggle("hidden", !isLoading);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            if (!email || !password) {
                showError("يرجى إدخال البريد الإلكتروني وكلمة المرور");
                return;
            }

            setLoading(true);
            try {
                const data = await apiRequest("/api/admin/login", {
                    method: "POST",
                    body: JSON.stringify({ email, password })
                });

                localStorage.setItem("admin_token", data.token);
                localStorage.setItem("admin_info", JSON.stringify(data.admin));
                document.body.setAttribute("data-login-success", "true");
                window.location.href = "admin-vendors.html";
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>
</html>
