<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | منصتي</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- الشريط العلوي -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-blue-700"><i class="fa-solid fa-store ml-2"></i>منصتي</a>
            <nav class="hidden sm:flex items-center gap-6 text-sm text-gray-600">
                <a href="index.html" class="hover:text-blue-600 transition-colors">الرئيسية</a>
                <a href="about.html" class="hover:text-blue-600 transition-colors">من نحن</a>
                <a href="contact.html" class="text-blue-600 font-bold">اتصل بنا</a>
            </nav>
        </div>
    </header>

    <!-- بطاقة العنوان -->
    <div class="bg-gradient-to-l from-blue-700 to-blue-600 text-white">
        <div class="max-w-4xl mx-auto px-4 sm:px-8 py-16 text-center">
            <h2 class="text-3xl sm:text-4xl font-extrabold mb-3">اتصل بنا</h2>
            <p class="text-blue-100 max-w-xl mx-auto">لديك سؤال أو استفسار؟ فريقنا جاهز لمساعدتك</p>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 sm:px-8 py-14">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- معلومات التواصل -->
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-start gap-4">
                    <div class="w-11 h-11 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-800 text-sm mb-1">الهاتف</p>
                        <p class="text-sm text-gray-500" dir="ltr">023 45 67 89</p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-start gap-4">
                    <div class="w-11 h-11 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-800 text-sm mb-1">البريد الإلكتروني</p>
                        <p class="text-sm text-gray-500" dir="ltr">support@yoursite.com</p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-start gap-4">
                    <div class="w-11 h-11 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-800 text-sm mb-1">واتساب</p>
                        <p class="text-sm text-gray-500" dir="ltr">0550 11 22 33</p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-start gap-4">
                    <div class="w-11 h-11 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-800 text-sm mb-1">أوقات الدعم</p>
                        <p class="text-sm text-gray-500">السبت – الخميس، 9 صباحاً – 6 مساءً</p>
                    </div>
                </div>
            </div>

            <!-- نموذج التواصل -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                    <h3 class="font-bold text-lg text-gray-800 mb-6">أرسل لنا رسالة</h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">الاسم الكامل <span class="text-red-500">*</span></label>
                            <input type="text" placeholder="مثال: محمد بن علي" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">رقم الهاتف <span class="text-red-500">*</span></label>
                            <input type="tel" dir="ltr" placeholder="05XX XX XX XX" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">البريد الإلكتروني</label>
                        <input type="email" dir="ltr" placeholder="example@mail.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
                    </div>

                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">الموضوع <span class="text-red-500">*</span></label>
                        <select class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                            <option>استفسار عن طلب</option>
                            <option>استفسار عن التسجيل كتاجر</option>
                            <option>مشكلة تقنية</option>
                            <option>اقتراح أو ملاحظة</option>
                            <option>أخرى</option>
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">رسالتك <span class="text-red-500">*</span></label>
                        <textarea rows="5" placeholder="اكتب تفاصيل استفسارك هنا..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <button type="button" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3.5 rounded-lg transition-colors flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane ml-2"></i> إرسال الرسالة
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer class="bg-white border-t border-gray-100">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-500">
            <p>© 2026 منصتي. جميع الحقوق محفوظة.</p>
            <div class="flex items-center gap-6">
                <a href="terms.html" class="hover:text-blue-600 transition-colors">الشروط والأحكام</a>
                <a href="about.html" class="hover:text-blue-600 transition-colors">من نحن</a>
            </div>
        </div>
    </footer>

</body>
</html>
