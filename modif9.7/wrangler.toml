name = "platform-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# قاعدة البيانات D1
[[d1_databases]]
binding = "DB"
database_name = "platform-db"
database_id = "9539c1b2-b3ff-450b-bd6d-27bbd958deb7"

# مساحة تخزين الصور (Cloudflare R2) — صور المنتجات وإثباتات الدفع
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "platform-images"

# مساحة KV لحماية Rate Limiting على مسارات تسجيل الدخول (تاجر + مشرف)
# أنشئها أولاً بالأمر: wrangler kv namespace create RATE_LIMIT_KV
# ثم ضع الـ id الذي يرجعه الأمر هنا بدل السطر الوهمي أدناه
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "052cac41ff5548589ba3d04daf7cd4ba"

# مساحة KV منفصلة لكاش ميزة الشحن التلقائي (أسعار التوصيل الحية، وقوائم المكاتب لاحقاً) — لا يعمل الشحن التلقائي بدونها
# مفصولة عمداً عن RATE_LIMIT_KV أعلاه: تنظيم أوضح لاستهلاك كل غرض على حدة، وعزل أمني (لو حدث خطأ بمنطق
# كاش الشحن مستقبلاً، لا يؤثر إطلاقاً على نظام حماية تسجيل الدخول الحساس)
# أنشئها بالأمر: wrangler kv namespace create SHIPPING_CACHE_KV
# ثم ضع الـ id الذي يرجعه الأمر هنا بدل السطر الوهمي أدناه — وإلا فشل `wrangler deploy`
# (لو أردت نشراً بالشحن اليدوي فقط قبل ذلك: علّم الكتلة [[kv_namespaces]] الخاصة بهذا الربط بـ# — النظام يبقى سليماً والشحن التلقائي مغلقاً)
[[kv_namespaces]]
binding = "SHIPPING_CACHE_KV"
id = "f3b1ed34abfd4f2ab36d49b2a39bad76"

[vars]
# الرابط العام لعرض الصور بعد ربط نطاق مخصص أو Public Development URL بالـ R2 bucket
R2_PUBLIC_URL = "https://pub-07edad6197f3466f9c10e85f04abc465.r2.dev"

# نطاقات الواجهة الأمامية المسموح لها بالاتصال بهذا الـAPI (مفصولة بفاصلة، بدون مسافة بعدها لو أكثر من واحد)
# مثال: "https://mysite.com,https://www.mysite.com"
# اتركه فارغاً مؤقتاً أثناء التطوير المحلي — لن يُقبل أي طلب من متصفح حتى تحدّده (رفض افتراضي آمن)
ALLOWED_ORIGINS = "https://minasati.brah73927.workers.dev"

# جدول Cron واحد كل دقيقتين يوزّع الأعمال بحسب وقته (راجع src/scheduled.js): طابور إنشاء الشحنات كل دورة،
# تتبع الشحنات مرة كل ربع ساعة، وفحص التجارب/الاشتراكات القاربة على الانتهاء عند 08:00–08:04 UTC (متكرر الأمان).
# يحل محل الجدول اليومي القديم "0 8 * * *" — لا تُبقِه، وإلا فُحصت التجارب مرتين بنفس اليوم (بلا ضرر لكن بلا فائدة)
[triggers]
crons = ["*/2 * * * *"]

# متغير سري لتوقيع رموز JWT — لا يوضع هنا مباشرة، بل عبر الأمر التالي:
# wrangler secret put JWT_SECRET
# wrangler secret put ADMIN_SETUP_KEY

# متغير سري لتشفير بيانات اعتماد شركات التوصيل (ميزة الشحن التلقائي) — عبر الأمر التالي، 16 حرفاً على الأقل
# (نص عشوائي طويل؛ أي سر أقصر يُرفض ويبقى الشحن التلقائي مغلقاً):
# wrangler secret put SHIPPING_ENCRYPTION_KEY
# مهم: لا تُغيّر هذا السر بعد إنشاء أي بيانات اعتماد مشفّرة بقاعدة البيانات، وإلا تعذّر فك تشفيرها لاحقاً

